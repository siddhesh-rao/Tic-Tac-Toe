<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable Tic-Tac-Toe (Minimax AI)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 90vw; /* Responsive width */
            max-width: 400px; /* Max size for desktop */
            aspect-ratio: 1 / 1; /* Keep it square */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            overflow: hidden;
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid #ccd0d7;
            transition: background-color 0.2s;
            user-select: none;
            color: #1e293b; /* Default text color */
        }
        .cell:hover:not([data-value]) {
            background-color: #e2e8f0;
        }
        .cell:nth-child(3n) { border-right: none; }
        .cell:nth-child(n + 7) { border-bottom: none; }
        .cell:nth-child(1) { border-top-left-radius: 10px; }
        .cell:nth-child(3) { border-top-right-radius: 10px; }
        .cell:nth-child(7) { border-bottom-left-radius: 10px; }
        .cell:nth-child(9) { border-bottom-right-radius: 10px; }

        /* Color classes for X and O */
        .text-x { color: #ef4444; } /* Red-500 */
        .text-o { color: #3b82f6; } /* Blue-500 */
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-xl w-full flex flex-col items-center space-y-6">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">
            Tic-Tac-Toe: AI vs. Human
        </h1>
        <div id="status" class="text-xl font-medium p-4 rounded-lg w-full text-center shadow-md bg-white">
            Your turn (X)
        </div>

        <div id="board" class="board bg-white">
            <!-- Cells will be generated by JavaScript -->
        </div>

        <button id="reset-button" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-lg hover:bg-indigo-700 transition duration-150 transform hover:scale-105">
            Reset Game
        </button>

    </div>

    <script>
        // --- GAME STATE AND INITIALIZATION ---
        const PLAYER_HUMAN = 'X';
        const PLAYER_AI = 'O';
        const EMPTY = '';

        let board = [
            [EMPTY, EMPTY, EMPTY],
            [EMPTY, EMPTY, EMPTY],
            [EMPTY, EMPTY, EMPTY]
        ];
        let currentPlayer = PLAYER_HUMAN;
        let isGameOver = false;

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const resetButton = document.getElementById('reset-button');

        // Initial setup
        function createBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }
        }

        // --- GAME LOGIC ---

        function checkWin(currentBoard, player) {
            // Check rows, columns, and diagonals
            const lines = [
                // Rows
                [[0, 0], [0, 1], [0, 2]],
                [[1, 0], [1, 1], [1, 2]],
                [[2, 0], [2, 1], [2, 2]],
                // Columns
                [[0, 0], [1, 0], [2, 0]],
                [[0, 1], [1, 1], [2, 1]],
                [[0, 2], [1, 2], [2, 2]],
                // Diagonals
                [[0, 0], [1, 1], [2, 2]],
                [[0, 2], [1, 1], [2, 0]]
            ];

            return lines.some(line =>
                line.every(([r, c]) => currentBoard[r][c] === player)
            );
        }

        function checkDraw(currentBoard) {
            return currentBoard.flat().every(cell => cell !== EMPTY);
        }

        function updateBoardUI() {
            const cells = boardElement.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                const value = board[r][c];

                cell.textContent = value;
                cell.dataset.value = value;

                // Update styling based on player
                cell.classList.remove('text-x', 'text-o');
                if (value === PLAYER_HUMAN) {
                    cell.classList.add('text-x');
                } else if (value === PLAYER_AI) {
                    cell.classList.add('text-o');
                }
            });
        }

        function checkGameEnd() {
            if (checkWin(board, PLAYER_HUMAN)) {
                statusElement.textContent = "You win! (Unlikely)";
                statusElement.classList.add('bg-green-100', 'text-green-800');
                isGameOver = true;
                return true;
            } else if (checkWin(board, PLAYER_AI)) {
                statusElement.textContent = "AI wins! (Unbeatable)";
                statusElement.classList.add('bg-red-100', 'text-red-800');
                isGameOver = true;
                return true;
            } else if (checkDraw(board)) {
                statusElement.textContent = "It's a Draw!";
                statusElement.classList.add('bg-yellow-100', 'text-yellow-800');
                isGameOver = true;
                return true;
            }
            return false;
        }

        function switchTurn() {
            if (isGameOver) return;

            currentPlayer = currentPlayer === PLAYER_HUMAN ? PLAYER_AI : PLAYER_HUMAN;
            statusElement.textContent = currentPlayer === PLAYER_HUMAN
                ? "Your turn (X)"
                : "AI is thinking (O)...";
            statusElement.classList.remove('bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');
            statusElement.classList.add('bg-white', 'text-gray-800');


            if (currentPlayer === PLAYER_AI) {
                // Delay AI move slightly for dramatic effect
                setTimeout(aiMove, 500);
            }
        }

        function handleCellClick(r, c) {
            if (isGameOver || board[r][c] !== EMPTY || currentPlayer !== PLAYER_HUMAN) {
                return;
            }

            // Human move
            board[r][c] = PLAYER_HUMAN;
            updateBoardUI();

            if (!checkGameEnd()) {
                switchTurn();
            }
        }

        function resetGame() {
            board = [
                [EMPTY, EMPTY, EMPTY],
                [EMPTY, EMPTY, EMPTY],
                [EMPTY, EMPTY, EMPTY]
            ];
            isGameOver = false;
            currentPlayer = PLAYER_HUMAN;
            createBoard(); // Recreate cells to re-attach listeners
            updateBoardUI();
            statusElement.textContent = "Your turn (X)";
            statusElement.classList.remove('bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');
            statusElement.classList.add('bg-white', 'text-gray-800');
        }

        resetButton.addEventListener('click', resetGame);
        window.onload = resetGame; // Initialize on load


        // --- MINIMAX AI ALGORITHM ---
        
        // This function assigns a score to the current board state.
        // The score is relative to the AI (Maximizing Player: 'O').
        function evaluate(currentBoard) {
            // Check for AI win
            if (checkWin(currentBoard, PLAYER_AI)) {
                return 10;
            }
            // Check for Human win
            if (checkWin(currentBoard, PLAYER_HUMAN)) {
                return -10;
            }
            // Draw or ongoing game
            return 0;
        }

        /*
        [Image of a Minimax Tree for Tic-Tac-Toe]
        The core of the AI. Minimax is a recursive algorithm that explores the game tree,
        assuming both players play optimally.
        - The Maximizer ('O', AI) tries to maximize the score.
        - The Minimizer ('X', Human) tries to minimize the score.
        */
        function minimax(currentBoard, depth, isMaximizing) {
            // Base case: Check if the game has ended (win, loss, or draw)
            let score = evaluate(currentBoard);

            if (score === 10 || score === -10 || checkDraw(currentBoard)) {
                // We subtract the depth to prefer faster wins (higher score) or delay inevitable losses (higher score)
                // If AI wins (+10), higher score is better: +10 - depth.
                // If AI loses (-10), higher score is better: -10 + depth (less negative).
                return score === 10 ? score - depth : (score === -10 ? score + depth : 0);
            }

            // If it's the Maximizing Player (AI: 'O')
            if (isMaximizing) {
                let bestScore = -Infinity;

                // Loop through all empty cells
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        if (currentBoard[r][c] === EMPTY) {
                            // 1. Make the move
                            currentBoard[r][c] = PLAYER_AI;
                            // 2. Recurse and get the score from the Minimizer's perspective
                            bestScore = Math.max(bestScore, minimax(currentBoard, depth + 1, false));
                            // 3. Undo the move (backtrack)
                            currentBoard[r][c] = EMPTY;
                        }
                    }
                }
                return bestScore;
            }
            // If it's the Minimizing Player (Human: 'X')
            else {
                let bestScore = Infinity;

                // Loop through all empty cells
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        if (currentBoard[r][c] === EMPTY) {
                            // 1. Make the move
                            currentBoard[r][c] = PLAYER_HUMAN;
                            // 2. Recurse and get the score from the Maximizer's perspective
                            bestScore = Math.min(bestScore, minimax(currentBoard, depth + 1, true));
                            // 3. Undo the move (backtrack)
                            currentBoard[r][c] = EMPTY;
                        }
                    }
                }
                return bestScore;
            }
        }

        // Wrapper to find the optimal move (row, col)
        function findBestMove() {
            let bestScore = -Infinity;
            let bestMove = { row: -1, col: -1 };
            
            // Loop through all possible moves on the current board
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    if (board[r][c] === EMPTY) {
                        // Try this spot
                        board[r][c] = PLAYER_AI;
                        
                        // Calculate the score this move leads to, assuming optimal play by the opponent
                        let score = minimax(board, 0, false); // Next turn is Minimizing player (Human)
                        
                        // Undo the move
                        board[r][c] = EMPTY;
                        
                        // If the calculated score is better than the current best score, update the best move
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove.row = r;
                            bestMove.col = c;
                        }
                    }
                }
            }
            return bestMove;
        }

        function aiMove() {
            if (isGameOver) return;

            const move = findBestMove();

            if (move.row !== -1 && move.col !== -1) {
                // Execute the best move
                board[move.row][move.col] = PLAYER_AI;
                updateBoardUI();

                if (!checkGameEnd()) {
                    switchTurn();
                }
            } else {
                // This shouldn't happen unless the board is full (Draw state)
                checkGameEnd();
            }
        }
    </script>
    <footer>GitHub: siddhesh-rao</footer>
</body>
</html>
